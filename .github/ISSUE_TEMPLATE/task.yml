name: Task
description: A single piece of work under an epic.
body:
  - type: markdown
    attributes:
      value: |
        Link this to its epic using **Create sub-issue** on the epic. Typing `#123` here is
        only a mention and will not link it — it never reaches the epic's progress bar.
  - type: input
    id: plan
    attributes:
      label: Plan
      description: Path to the merged plan, if this work needed one. Leave blank if not.
  - type: textarea
    id: what
    attributes:
      label: What needs to happen
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The observable condition. A test that passes, a flow that works.
    validations:
      required: true
